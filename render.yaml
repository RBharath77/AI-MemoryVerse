services:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND WEB SERVICE (Next.js)
  # ----------------------------------------------------------------------------
  - type: web
    name: memoryverse-web
    runtime: node
    plan: standard
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: memoryverse-api
          property: host
          path: /api/v1
      - key: NEXT_PUBLIC_APP_NAME
        value: AI-MemoryVerse
      - key: NEXT_PUBLIC_APP_ENV
        value: production

  # ----------------------------------------------------------------------------
  # 2. BACKEND API SERVICE (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: memoryverse-api
    runtime: python
    plan: standard
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: AI-MemoryVerse
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: memoryverse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: memoryverse-queue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: memoryverse-queue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: memoryverse-queue
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: memoryverse-web
          property: host
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: memoryverse-web
          property: host
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 3. BACKGROUND WORKER SERVICE (Celery)
  # ----------------------------------------------------------------------------
  - type: worker
    name: memoryverse-worker
    runtime: python
    plan: standard
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: memoryverse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: memoryverse-queue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: memoryverse-queue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: memoryverse-queue
          property: connectionString
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false

# ------------------------------------------------------------------------------
# 4. MANAGED DATABASES & QUEUES
# ------------------------------------------------------------------------------
databases:
  - name: memoryverse-db
    databaseName: memoryverse
    user: memoryverse_user
    plan: standard
    postgresMajorVersion: 16

services_redis:
  - type: redis
    name: memoryverse-queue
    plan: standard
    ipAllowList: [] # internal access only

