<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%" style="background:#0b0a16; border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ddbd9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff4f81"/>
    </linearGradient>

    <filter id="flowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .packet-cyan {
        stroke-dasharray: 12, 45;
        animation: streamFlow 2.5s linear infinite;
      }
      .packet-violet {
        stroke-dasharray: 10, 40;
        animation: streamFlow 2s linear infinite 0.5s;
      }
      .packet-pink {
        stroke-dasharray: 14, 50;
        animation: streamFlow 2.8s linear infinite 1s;
      }
      .pulse-node {
        animation: pulseNode 2.2s ease-in-out infinite alternate;
      }

      @keyframes streamFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0% { transform: scale(0.98); opacity: 0.85; }
        100% { transform: scale(1.02); opacity: 1; filter: drop-shadow(0 0 8px rgba(61, 219, 217, 0.5)); }
      }
    </style>
  </defs>

  <!-- Canvas Subtle Grid -->
  <g opacity="0.05" stroke="#3ddbd9" stroke-width="0.5">
    <line x1="0" y1="55" x2="920" y2="55"/>
    <line x1="0" y1="110" x2="920" y2="110"/>
    <line x1="0" y1="165" x2="920" y2="165"/>
  </g>

  <!-- Animated Streaming Data Paths -->
  <g fill="none" stroke-linecap="round">
    <!-- Background Static Tracks -->
    <path d="M 195 110 L 330 110" stroke="#1f1c38" stroke-width="2.5"/>
    <path d="M 490 110 L 625 110" stroke="#1f1c38" stroke-width="2.5"/>
    <path d="M 785 110 L 870 110" stroke="#1f1c38" stroke-width="2.5"/>

    <!-- Streaming Light Pulses -->
    <path d="M 195 110 L 330 110" stroke="#3ddbd9" stroke-width="3" class="packet-cyan" filter="url(#flowGlow)"/>
    <path d="M 490 110 L 625 110" stroke="#a855f7" stroke-width="3" class="packet-violet" filter="url(#flowGlow)"/>
    <path d="M 785 110 L 870 110" stroke="#ff4f81" stroke-width="3" class="packet-pink" filter="url(#flowGlow)"/>
  </g>

  <!-- ============================================================= -->
  <!-- NODE 1: MULTI-MODAL INGESTION                                -->
  <!-- ============================================================= -->
  <g transform="translate(45, 60)" class="pulse-node">
    <rect width="150" height="100" rx="12" fill="#141126" stroke="#3ddbd9" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect width="150" height="4" rx="2" fill="#3ddbd9"/>
    <text x="75" y="32" text-anchor="middle" font-size="16">📥</text>
    <text x="75" y="54" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f8f3f0">Multi-Modal Ingest</text>
    <text x="75" y="72" text-anchor="middle" font-size="9" fill="#a0a3ba">Audio • PDF • Docs • Web</text>
    <text x="75" y="86" text-anchor="middle" font-size="8.5" font-weight="600" fill="#3ddbd9">SSRF &amp; Magic Sanitized</text>
  </g>

  <!-- ============================================================= -->
  <!-- NODE 2: ZERO-TRUST COGNITIVE CORE                            -->
  <!-- ============================================================= -->
  <g transform="translate(330, 60)" class="pulse-node">
    <rect width="160" height="100" rx="12" fill="#141126" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect width="160" height="4" rx="2" fill="#a855f7"/>
    <text x="80" y="32" text-anchor="middle" font-size="16">⚡</text>
    <text x="80" y="54" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f8f3f0">Cognitive Core</text>
    <text x="80" y="72" text-anchor="middle" font-size="9" fill="#a0a3ba">Prompt Guard • DLP</text>
    <text x="80" y="86" text-anchor="middle" font-size="8.5" font-weight="600" fill="#c084fc">ABAC &amp; Tenant Isolated</text>
  </g>

  <!-- ============================================================= -->
  <!-- NODE 3: DUAL VECTOR & KNOWLEDGE GRAPH ENGINE                 -->
  <!-- ============================================================= -->
  <g transform="translate(625, 60)" class="pulse-node">
    <rect width="160" height="100" rx="12" fill="#141126" stroke="#ff4f81" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect width="160" height="4" rx="2" fill="#ff4f81"/>
    <text x="80" y="32" text-anchor="middle" font-size="16">🧠</text>
    <text x="80" y="54" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f8f3f0">Hybrid RRF Engine</text>
    <text x="80" y="72" text-anchor="middle" font-size="9" fill="#a0a3ba">pgvector HNSW • BM25</text>
    <text x="80" y="86" text-anchor="middle" font-size="8.5" font-weight="600" fill="#fb7185">Multi-Hop Entity Graph</text>
  </g>

  <!-- ============================================================= -->
  <!-- NODE 4: MCP PROTOCOL & APPLICATION STREAM                    -->
  <!-- ============================================================= -->
  <g transform="translate(820, 60)">
    <circle cx="50" cy="50" r="38" fill="#141126" stroke="#ffc857" stroke-width="1.4" stroke-opacity="0.6"/>
    <text x="50" y="44" text-anchor="middle" font-size="16">🔌</text>
    <text x="50" y="62" text-anchor="middle" font-size="10" font-weight="700" fill="#ffc857">MCP / SSE</text>
    <text x="50" y="76" text-anchor="middle" font-size="8" fill="#a0a3ba">Grounding</text>
  </g>
</svg>

