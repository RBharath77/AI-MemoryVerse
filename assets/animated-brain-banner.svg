<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%" style="background:#090814; border-radius: 16px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070611"/>
      <stop offset="50%" stop-color="#120f24"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>

    <radialGradient id="neuralGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3ddbd9" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#7928ca" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#ff0080" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070611" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ddbd9" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#014baa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070611" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ddbd9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ff4f81"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      .spin-cw {
        animation: spinClockwise 22s linear infinite;
        transform-origin: 500px 175px;
      }
      .spin-ccw {
        animation: spinCounter 16s linear infinite;
        transform-origin: 500px 175px;
      }
      .pulse-core {
        animation: pulseCore 3.5s ease-in-out infinite;
        transform-origin: 500px 175px;
      }
      .pulse-slow {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
      .signal-stream {
        stroke-dasharray: 8, 16;
        animation: streamPulse 2s linear infinite;
      }
      .signal-stream-fast {
        stroke-dasharray: 6, 14;
        animation: streamPulseFast 1.4s linear infinite;
      }
      .signal-stream-rev {
        stroke-dasharray: 8, 18;
        animation: streamPulseRev 2.2s linear infinite;
      }
      .node-fire-cyan {
        animation: fireCyan 2.8s ease-in-out infinite;
      }
      .node-fire-pink {
        animation: firePink 3.2s ease-in-out infinite 0.7s;
      }
      .node-fire-amber {
        animation: fireAmber 2.4s ease-in-out infinite 1.2s;
      }
      .scan-beam {
        animation: scanVertical 4s ease-in-out infinite;
      }
      .badge-glow {
        animation: badgeGlow 2s ease-in-out infinite alternate;
      }
      .floating-particle {
        animation: floatParticle 6s ease-in-out infinite alternate;
      }

      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseCore {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 16px rgba(61, 219, 217, 0.7)); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.35; transform: scale(0.96); }
        100% { opacity: 0.65; transform: scale(1.04); }
      }
      @keyframes streamPulse {
        to { stroke-dashoffset: -48; }
      }
      @keyframes streamPulseFast {
        to { stroke-dashoffset: -40; }
      }
      @keyframes streamPulseRev {
        to { stroke-dashoffset: 52; }
      }
      @keyframes fireCyan {
        0%, 100% { r: 3; fill: #3ddbd9; opacity: 0.5; }
        50% { r: 6.5; fill: #ffffff; opacity: 1; filter: drop-shadow(0 0 10px #3ddbd9); }
      }
      @keyframes firePink {
        0%, 100% { r: 2.8; fill: #ff4f81; opacity: 0.5; }
        50% { r: 6; fill: #ffffff; opacity: 1; filter: drop-shadow(0 0 10px #ff4f81); }
      }
      @keyframes fireAmber {
        0%, 100% { r: 2.6; fill: #ffc857; opacity: 0.5; }
        50% { r: 5.5; fill: #ffffff; opacity: 1; filter: drop-shadow(0 0 8px #ffc857); }
      }
      @keyframes scanVertical {
        0% { transform: translateY(-70px); opacity: 0; }
        30% { opacity: 0.6; }
        70% { opacity: 0.6; }
        100% { transform: translateY(180px); opacity: 0; }
      }
      @keyframes badgeGlow {
        0% { filter: drop-shadow(0 0 2px #10b981); opacity: 0.85; }
        100% { filter: drop-shadow(0 0 8px #10b981); opacity: 1; }
      }
      @keyframes floatParticle {
        0% { transform: translate(0, 0); }
        100% { transform: translate(12px, -16px); }
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1000" height="420" fill="url(#bgGrad)"/>

  <!-- Matrix Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#3ddbd9" stroke-width="0.75">
    <line x1="0" y1="70" x2="1000" y2="70"/>
    <line x1="0" y1="140" x2="1000" y2="140"/>
    <line x1="0" y1="210" x2="1000" y2="210"/>
    <line x1="0" y1="280" x2="1000" y2="280"/>
    <line x1="0" y1="350" x2="1000" y2="350"/>
    <line x1="125" y1="0" x2="125" y2="420"/>
    <line x1="250" y1="0" x2="250" y2="420"/>
    <line x1="375" y1="0" x2="375" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="625" y1="0" x2="625" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="875" y1="0" x2="875" y2="420"/>
  </g>

  <!-- Volumetric Ambient Light Aura -->
  <circle cx="500" cy="175" r="240" fill="url(#neuralGlow)" class="pulse-slow"/>

  <!-- Celestial Dust Particles -->
  <g opacity="0.35" class="floating-particle">
    <circle cx="210" cy="90" r="1.5" fill="#3ddbd9"/>
    <circle cx="280" cy="190" r="1.8" fill="#ff4f81"/>
    <circle cx="160" cy="240" r="1.2" fill="#ffc857"/>
    <circle cx="820" cy="110" r="1.6" fill="#3ddbd9"/>
    <circle cx="740" cy="220" r="1.4" fill="#a78bfa"/>
    <circle cx="860" cy="260" r="1.8" fill="#ffc857"/>
    <circle cx="380" cy="70" r="1.3" fill="#ffffff"/>
    <circle cx="630" cy="65" r="1.5" fill="#ffffff"/>
  </g>

  <!-- ============================================================= -->
  <!-- 3D NEURAL ORBITAL RINGS & SATELLITES                         -->
  <!-- ============================================================= -->

  <!-- Outer Orbital Gyro Ring (Clockwise) -->
  <g class="spin-cw">
    <ellipse cx="500" cy="175" rx="195" ry="110" fill="none" stroke="#3ddbd9" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="14 18"/>
    <!-- Orbiting Satellite Node -->
    <circle cx="695" cy="175" r="5" fill="#3ddbd9" filter="url(#glow)"/>
    <circle cx="305" cy="175" r="3.5" fill="#3ddbd9" opacity="0.8"/>
  </g>

  <!-- Middle Orbital Gyro Track (Counter-Clockwise, Tilted) -->
  <g class="spin-ccw">
    <ellipse cx="500" cy="175" rx="160" ry="85" fill="none" stroke="#ff4f81" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="8 12" transform="rotate(-25 500 175)"/>
    <!-- Orbiting Pink Satellite -->
    <circle cx="660" cy="175" r="4.5" fill="#ff4f81" filter="url(#glow)" transform="rotate(-25 500 175)"/>
  </g>

  <!-- Inner Amber Synaptic Ring -->
  <g class="spin-cw">
    <ellipse cx="500" cy="175" rx="125" ry="65" fill="none" stroke="#ffc857" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 8" transform="rotate(35 500 175)"/>
    <!-- Orbiting Solar Amber Satellite -->
    <circle cx="625" cy="175" r="4" fill="#ffc857" filter="url(#glow)" transform="rotate(35 500 175)"/>
  </g>

  <!-- Vertical Laser Scan Beam -->
  <g opacity="0.2">
    <line x1="380" y1="175" x2="620" y2="175" stroke="#3ddbd9" stroke-width="2.5" class="scan-beam" filter="url(#glow)"/>
  </g>

  <!-- ============================================================= -->
  <!-- CENTRAL QUANTUM NEURAL BRAIN CORE & SYNAPSES                 -->
  <!-- ============================================================= -->
  <g class="pulse-core">
    <!-- Volumetric Core Drop Shadow -->
    <circle cx="500" cy="175" r="75" fill="url(#coreAura)"/>

    <!-- Synaptic Pathways (Interconnecting Edges) -->
    <g stroke-linecap="round">
      <!-- Background Static Neural Lines -->
      <g stroke="#2a2550" stroke-width="1.4" opacity="0.6">
        <!-- Left Hemisphere -->
        <line x1="440" y1="130" x2="470" y2="145"/>
        <line x1="420" y1="165" x2="450" y2="175"/>
        <line x1="435" y1="205" x2="465" y2="195"/>
        <line x1="470" y1="145" x2="485" y2="175"/>
        <line x1="450" y1="175" x2="485" y2="175"/>
        <line x1="465" y1="195" x2="485" y2="175"/>
        <line x1="440" y1="130" x2="420" y2="165"/>
        <line x1="420" y1="165" x2="435" y2="205"/>
        <line x1="410" y1="185" x2="435" y2="205"/>
        <line x1="455" y1="225" x2="475" y2="210"/>
        <!-- Right Hemisphere -->
        <line x1="560" y1="130" x2="530" y2="145"/>
        <line x1="580" y1="165" x2="550" y2="175"/>
        <line x1="565" y1="205" x2="535" y2="195"/>
        <line x1="530" y1="145" x2="515" y2="175"/>
        <line x1="550" y1="175" x2="515" y2="175"/>
        <line x1="535" y1="195" x2="515" y2="175"/>
        <line x1="560" y1="130" x2="580" y2="165"/>
        <line x1="580" y1="165" x2="565" y2="205"/>
        <line x1="590" y1="185" x2="565" y2="205"/>
        <line x1="545" y1="225" x2="525" y2="210"/>
        <!-- Corpus Callosum (Central Bridge) -->
        <line x1="485" y1="175" x2="515" y2="175"/>
        <line x1="470" y1="145" x2="530" y2="145"/>
        <line x1="465" y1="195" x2="535" y2="195"/>
      </g>

      <!-- Active Pulsing Cyan Signals (Left Hemisphere & Bridge) -->
      <g stroke="#3ddbd9" stroke-width="1.8" fill="none" opacity="0.85">
        <path d="M440,130 L470,145 L485,175 L515,175 L550,175" class="signal-stream"/>
        <path d="M420,165 L450,175 L485,175 L530,145 L560,130" class="signal-stream-fast"/>
        <path d="M455,225 L465,195 L485,175 L515,175 L535,195" class="signal-stream-rev"/>
      </g>

      <!-- Active Pulsing Magenta/Pink Signals (Right Hemisphere) -->
      <g stroke="#ff4f81" stroke-width="1.8" fill="none" opacity="0.85">
        <path d="M560,130 L530,145 L515,175 L485,175 L450,175" class="signal-stream"/>
        <path d="M580,165 L550,175 L515,175 L470,145 L440,130" class="signal-stream-fast"/>
        <path d="M545,225 L535,195 L515,175 L485,175 L465,195" class="signal-stream-rev"/>
      </g>

      <!-- Active Solar Amber Signals (Cross-Synapses) -->
      <g stroke="#ffc857" stroke-width="1.6" fill="none" opacity="0.9">
        <path d="M470,145 L530,145" class="signal-stream-fast"/>
        <path d="M465,195 L535,195" class="signal-stream"/>
      </g>
    </g>

    <!-- Synaptic Nodes (Neurons) -->
    <!-- Central Hub -->
    <circle cx="485" cy="175" r="4.5" fill="#3ddbd9" class="node-fire-cyan" filter="url(#glow)"/>
    <circle cx="515" cy="175" r="4.5" fill="#ff4f81" class="node-fire-pink" filter="url(#glow)"/>

    <!-- Left Hemisphere Nodes -->
    <circle cx="440" cy="130" r="3.5" class="node-fire-cyan"/>
    <circle cx="470" cy="145" r="4" class="node-fire-amber"/>
    <circle cx="420" cy="165" r="4" class="node-fire-cyan"/>
    <circle cx="450" cy="175" r="3.5" class="node-fire-pink"/>
    <circle cx="410" cy="185" r="3" class="node-fire-cyan"/>
    <circle cx="435" cy="205" r="4" class="node-fire-cyan"/>
    <circle cx="465" cy="195" r="3.8" class="node-fire-amber"/>
    <circle cx="455" cy="225" r="3" class="node-fire-cyan"/>
    <circle cx="475" cy="210" r="3" class="node-fire-pink"/>

    <!-- Right Hemisphere Nodes -->
    <circle cx="560" cy="130" r="3.5" class="node-fire-pink"/>
    <circle cx="530" cy="145" r="4" class="node-fire-amber"/>
    <circle cx="580" cy="165" r="4" class="node-fire-pink"/>
    <circle cx="550" cy="175" r="3.5" class="node-fire-cyan"/>
    <circle cx="590" cy="185" r="3" class="node-fire-pink"/>
    <circle cx="565" cy="205" r="4" class="node-fire-pink"/>
    <circle cx="535" cy="195" r="3.8" class="node-fire-amber"/>
    <circle cx="545" cy="225" r="3" class="node-fire-pink"/>
    <circle cx="525" cy="210" r="3" class="node-fire-cyan"/>
  </g>

  <!-- ============================================================= -->
  <!-- TYPOGRAPHY & BRAND IDENTITY                                  -->
  <!-- ============================================================= -->

  <!-- Main Title: AI-MEMORYVERSE -->
  <text x="500" y="300" text-anchor="middle" font-size="28" font-weight="900" letter-spacing="4" fill="url(#textGrad)" filter="url(#glow)">
    AI-MEMORYVERSE
  </text>

  <!-- Tagline -->
  <text x="500" y="325" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="3" fill="#a0a3ba">
    REMEMBER • CONNECT • UNDERSTAND • RETRIEVE
  </text>

  <!-- Subtitle Category Badge -->
  <text x="500" y="345" text-anchor="middle" font-size="10.5" font-weight="500" letter-spacing="1" fill="#3ddbd9" opacity="0.9">
    Personal AI Memory &amp; Cognitive Intelligence Architecture
  </text>

  <!-- ============================================================= -->
  <!-- INTERACTIVE SYSTEM STATUS PILLS (BOTTOM ROW)                 -->
  <!-- ============================================================= -->
  <g transform="translate(145, 365)">
    <!-- Pill 1: 280/280 Tests Passing -->
    <g transform="translate(0, 0)">
      <rect width="165" height="30" rx="15" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="18" cy="15" r="4" fill="#10b981" class="badge-glow"/>
      <text x="30" y="19" font-size="10" font-weight="700" fill="#34d399">280 / 280 Tests Passed</text>
    </g>

    <!-- Pill 2: 38 Hardened Cognitive Phases -->
    <g transform="translate(180, 0)">
      <rect width="175" height="30" rx="15" fill="rgba(6, 182, 212, 0.12)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
      <text x="18" y="19" font-size="11">⚡</text>
      <text x="34" y="19" font-size="10" font-weight="700" fill="#22d3ee">38 Cognitive Phases</text>
    </g>

    <!-- Pill 3: Real 3D Neural Brain Loader -->
    <g transform="translate(370, 0)">
      <rect width="165" height="30" rx="15" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
      <text x="16" y="19" font-size="11">🧠</text>
      <text x="32" y="19" font-size="10" font-weight="700" fill="#c084fc">Real Brain Loader</text>
    </g>

    <!-- Pill 4: Model Context Protocol (MCP) Ready -->
    <g transform="translate(550, 0)">
      <rect width="160" height="30" rx="15" fill="rgba(255, 79, 129, 0.12)" stroke="#ff4f81" stroke-width="1" stroke-opacity="0.4"/>
      <text x="16" y="19" font-size="11">🔌</text>
      <text x="32" y="19" font-size="10" font-weight="700" fill="#fb7185">MCP Protocol Ready</text>
    </g>
  </g>
</svg>
