services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memoryverse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: memoryverse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memoryverse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - memoryverse_net

  redis:
    image: redis:7-alpine
    container_name: memoryverse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - memoryverse_net

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: memoryverse_backend
    restart: unless-stopped
    environment:
      - APP_NAME=AI-MemoryVerse
      - APP_ENV=development
      - DEBUG=true
      - SECRET_KEY=super-secret-local-dev-key-minimum-32-chars-long
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/memoryverse
      - DATABASE_SYNC_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/memoryverse
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LLM_PROVIDER=mock
      - EMBEDDING_PROVIDER=mock
      - STORAGE_PROVIDER=local
      - FRONTEND_URL=http://localhost:3000
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - local_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - memoryverse_net

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.worker
    container_name: memoryverse_worker
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/memoryverse
      - DATABASE_SYNC_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/memoryverse
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LLM_PROVIDER=mock
      - EMBEDDING_PROVIDER=mock
      - STORAGE_PROVIDER=local
    volumes:
      - ./backend:/app
      - local_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - memoryverse_net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: memoryverse_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_APP_NAME=AI-MemoryVerse
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - memoryverse_net

volumes:
  postgres_data:
  redis_data:
  local_storage:

networks:
  memoryverse_net:
    driver: bridge
