user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide server version for information disclosure defense
    server_tokens off;

    # Performance optimizations
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;

    # Buffer & Timeout Limits against Slowloris & Buffer Overflow attacks
    client_body_buffer_size      256k;
    client_header_buffer_size    2k;
    large_client_header_buffers  4 16k;
    client_max_body_size         50M;
    client_body_timeout          30s;
    client_header_timeout        30s;
    send_timeout                 30s;

    # Rate Limiting & Connection Defense Zones
    # 1. API general traffic: 30 requests/sec per client IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    # 2. Strict Auth endpoints (login/register): 5 requests/sec per client IP to prevent brute-force
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
    # 3. Connection limit: maximum 50 concurrent connections per client IP
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

    # Log Format with Upstream Latency Telemetry
    log_format  main_timed  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for" '
                            'rt=$request_time uct="$upstream_connect_time" '
                            'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main_timed;

    # Gzip Compression
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Include virtual host configurations
    include /etc/nginx/conf.d/*.conf;
}

