# ==============================================================================
# AI-MemoryVerse — Production HTTPS Load Balancer & Reverse Proxy Configuration
# Full TLS/SSL Termination, Round-Robin Load Balancing, Security Hardening, & Rate Limiting
# ==============================================================================

# WebSocket Connection Upgrade Map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# Upstream Load Balancing Clusters
# ------------------------------------------------------------------------------
upstream backend_cluster {
    least_conn; # Routes traffic to the backend instance with fewest active connections
    server backend:8000 max_fails=3 fail_timeout=10s;
    # Scalable: add backend_2:8000, backend_3:8000 when horizontally scaling
    keepalive 32;
}

upstream frontend_cluster {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# Port 80 — HTTP to HTTPS Redirector
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost memoryverse.local *.memoryverse.local _;

    # Allow Let's Encrypt / ACME challenge verification over plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Permanent 301 Redirect for all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# Port 443 — Secure HTTPS Load Balancer & WAF Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name localhost memoryverse.local *.memoryverse.local _;

    # TLS / SSL Certificates
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Modern TLS Security Protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Max concurrent connections per IP
    limit_conn addr_conn 50;

    # --------------------------------------------------------------------------
    # Defense-in-Depth Security Headers
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=*, geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: ws:; media-src 'self' blob:; object-src 'none';" always;

    # --------------------------------------------------------------------------
    # WAF Exploit & Probe Filtering
    # --------------------------------------------------------------------------
    # Block hidden files (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block PHP / ASP / CGI script exploitation attempts
    location ~* \.(php|asp|aspx|jsp|cgi|env|git)$ {
        return 404;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Proxy Headers Configuration Macro
    # --------------------------------------------------------------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_http_version 1.1;

    # --------------------------------------------------------------------------
    # 1. Authentication Endpoints — Hardened Rate Limiting
    # --------------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --------------------------------------------------------------------------
    # 2. Real-time Streaming & Server-Sent Events (SSE)
    # --------------------------------------------------------------------------
    location ~ ^/api/v1/(chat/stream|mcp/sse) {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://backend_cluster;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --------------------------------------------------------------------------
    # 3. General API & Documentation Endpoints
    # --------------------------------------------------------------------------
    location ~ ^/(api/|docs|redoc|openapi\.json|health|ready) {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 90s;
    }

    # --------------------------------------------------------------------------
    # 4. Next.js Frontend Static Caching Optimization
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://frontend_cluster;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 5. Frontend Web Application & WebSockets (HMR / Live Updates)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

