name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: memoryverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/memoryverse_test
          DATABASE_SYNC_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/memoryverse_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-32-chars-long-strictly-for-ci
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
        run: |
          cd backend
          pytest -v --cov=app tests/

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Type Check & Lint
        run: |
          cd frontend
          npm run lint || true
          npx tsc --noEmit || true

      - name: Verify Next.js Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: |
          cd frontend
          npm run build
